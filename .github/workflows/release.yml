name: release

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./build_release.ps1
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/ThrowingDistanceScale-windows-x64.zip
          generate_release_notes: true
